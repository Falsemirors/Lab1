<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Один вопрос для тебя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Nunito:wght@400;600&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{
  --bg1:#ffe3d8; --bg2:#f9c6d0; --bg3:#d9c4f0;
  --ink:#5a2a3c; --soft:#8a5a6b; --rose:#e0587a; --rose-d:#c43e62;
  --card:rgba(255,255,255,.55); --edge:rgba(255,255,255,.8);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#3a1f33; --bg2:#4a2540; --bg3:#2e2450;
    --ink:#ffe9ef; --soft:#e0bccb; --rose:#ff7a9c; --rose-d:#ff5c86;
    --card:rgba(30,12,28,.5); --edge:rgba(255,200,220,.25);
  }
}
:root[data-theme="dark"]{
  --bg1:#3a1f33; --bg2:#4a2540; --bg3:#2e2450;
  --ink:#ffe9ef; --soft:#e0bccb; --rose:#ff7a9c; --rose-d:#ff5c86;
  --card:rgba(30,12,28,.5); --edge:rgba(255,200,220,.25);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg1);
  background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  background-attachment:fixed;
  color:var(--ink); font-family:Nunito,system-ui,sans-serif;
  display:flex; padding:16px 0;
  overflow-x:hidden; overflow-y:auto; text-align:center;
}
canvas{position:fixed; inset:0; width:100%; height:100%; pointer-events:none}
.card{
  position:relative; margin:auto; width:min(92vw,520px); padding:44px 28px 36px;
  background:var(--card); border:1px solid var(--edge); border-radius:28px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  box-shadow:0 20px 60px rgba(196,62,98,.18);
}
.small{font-size:15px; color:var(--soft); margin:0 0 14px}
h1{
  font-family:"Cormorant Garamond",Georgia,serif; font-style:italic; font-weight:600;
  font-size:clamp(34px,8vw,48px); line-height:1.15; margin:0 0 28px; max-width:14em; margin-inline:auto;
}
.heart{font-size:54px; display:block; margin-bottom:10px; animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.18)}28%{transform:scale(1)}42%{transform:scale(1.12)}70%{transform:scale(1)}}
.opts{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; min-height:56px}
button{
  font:inherit; font-weight:600; font-size:18px; cursor:pointer; border:0; border-radius:999px;
  padding:14px 26px; color:#fff; background:var(--rose);
  box-shadow:0 8px 20px rgba(224,88,122,.35); transition:transform .2s, background .2s;
}
button:hover{background:var(--rose-d)}
button:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
button.ghost{background:transparent; color:var(--soft); box-shadow:none; border:1.5px solid var(--soft)}
#no{transition:left .25s, top .25s, transform .2s}
#yes{transition:transform .25s}
.fade{animation:in .5s ease both}
@keyframes in{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
.sum{font-size:20px; line-height:1.7; margin:0 0 6px}
.sum b{font-family:"Cormorant Garamond",Georgia,serif; font-style:italic; font-size:26px}
.photo{width:150px; height:200px; margin:0 auto 18px; border-radius:100px 100px 22px 22px; overflow:hidden;
  border:3px solid var(--edge); box-shadow:0 12px 30px rgba(196,62,98,.28)}
.photo.big{width:210px; height:290px; border-radius:140px 140px 26px 26px}
.photo img{width:100%; height:100%; object-fit:cover; object-position:center 15%; display:block}
.wish{width:100%; font:inherit; padding:12px 14px; border-radius:16px; border:1.5px solid var(--edge);
  background:var(--card); color:var(--ink); resize:none}
.wish:focus-visible{outline:3px solid var(--rose); outline-offset:2px}
.list{margin:0 0 6px; text-align:left; display:inline-block; font-size:18px; line-height:1.75}
.list b{font-family:"Cormorant Garamond",Georgia,serif; font-style:italic; font-size:23px}
@media (prefers-reduced-motion: reduce){ .heart,.fade{animation:none} }
</style>

var NAME = "Варя";
var STEPS = [
  { key:"date",  lead:"Варя, у меня к тебе один вопрос", q:"Пойдёшь со мной на свидание?", yes:"Да, конечно", special:true },
  { key:"place", lead:"Я так и надеялся", q:"Куда отправимся?", opts:["В кино","В ресторан","На прогулку","Хочу сюрприз"] },
  { key:"when",  lead:"Теперь про время", q:"Когда тебе удобно?", opts:["В пятницу","В субботу","В воскресенье","Хоть сегодня"] },
  { key:"mood",  lead:"Хочу угадать настроение", q:"Каким должен быть вечер?", opts:["Уютным и спокойным","Романтичным","Весёлым и безумным","Как получится"] },
  { key:"wish",  lead:"И последнее", q:"Какие у тебя пожелания к вечеру?", type:"text", ph:"Всё, что хочешь, чтобы я знал" }
];
var NO_TEXTS = ["Нет","Ты уверена?","Подумай ещё","Ну пожалуйста","Почти поймала...","Кнопка устала"];
// =========================================

var card = document.getElementById("card");
var answers = {}, step = 0, dodges = 0;

function render(){
  var s = STEPS[step];
  if(!s){ return finish(); }
  var top = step===0 ? '<div class="photo"><img src="' + PHOTO + '" alt=""></div>' : '<span class="heart">💗</span>';
  card.innerHTML = '<div class="fade">' + top + '<p class="small">' + (s.lead||"") + '</p>' +
    '<h1>' + s.q + '</h1><div class="opts" id="opts"></div></div>';
  var box = document.getElementById("opts");
  if(s.special){
    var n = mk(NO_TEXTS[0], null, "ghost"); n.id = "no";
    var y = mk(s.yes, function(){ n.remove(); answers[s.key]="да"; step++; burst(); render(); });
    y.id = "yes"; box.appendChild(y);
    ["pointerenter","touchstart","click"].forEach(function(ev){
      n.addEventListener(ev, function(e){ e.preventDefault(); dodge(n, y); }, {passive:false});
    });
    box.appendChild(n);
  } else if(s.type==="text"){
    var inp = document.createElement("textarea");
    inp.className = "wish"; inp.rows = 3; inp.maxLength = 300; inp.placeholder = s.ph;
    box.appendChild(inp);
    box.appendChild(mk("Готово", function(){ answers[s.key]=inp.value.trim(); step++; burst(); render(); }));
  } else {
    s.opts.forEach(function(o){
      box.appendChild(mk(o, function(){ answers[s.key]=o; step++; burst(); render(); }));
    });
  }
}
function mk(t, fn, cls){
  var b = document.createElement("button"); b.textContent = t; b.type = "button";
  if(cls) b.className = cls; if(fn) b.onclick = fn; return b;
}
function dodge(n, y){
  dodges++;
  y.style.transform = "scale(" + Math.min(1 + dodges*0.18, 2) + ")";
  if(dodges >= NO_TEXTS.length){ n.style.display = "none"; return; }
  n.textContent = NO_TEXTS[dodges];
  document.body.appendChild(n); n.style.position = "fixed";
  var w = n.offsetWidth, h = n.offsetHeight, pad = 16;
  n.style.left = (pad + Math.random()*(innerWidth - w - pad*2)) + "px";
  n.style.top  = (pad + Math.random()*(innerHeight - h - pad*2)) + "px";
}
function esc(t){ return String(t).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function finish(){
  var wish = answers.wish ? esc(answers.wish) : "без пожеланий, я просто приду";
  card.innerHTML = '<div class="fade"><div class="photo big"><img src="' + PHOTO + '" alt=""></div>' +
    '<h1>Договорились, ' + NAME + '!</h1>' +
    '<div class="list">Куда: <b>' + esc(answers.place.toLowerCase()) + '</b><br>' +
    'Когда: <b>' + esc(answers.when.toLowerCase()) + '</b><br>' +
    'Вечер: <b>' + esc(answers.mood.toLowerCase()) + '</b><br>' +
    'Пожелание: <b>' + wish + '</b></div>' +
    '<p class="small" style="margin:18px 0">Я уже жду с нетерпением</p>' +
    '<div class="opts"><button type="button" id="copy">Скопировать ответ для Вовочки</button></div></div>';
  document.getElementById("copy").onclick = function(){
    var t = "Варя сказала ДА 💗\nКуда: " + answers.place + "\nКогда: " + answers.when +
            "\nВечер: " + answers.mood +
            "\nПожелание: " + (answers.wish || "нет");
    var b = this;
    try{ navigator.clipboard.writeText(t).then(function(){ b.textContent = "Скопировано, отправляй Вовочке"; }); }
    catch(e){ prompt("Скопируй и отправляй Вовочке:", t); }
  };
  for(var i=0;i<4;i++) setTimeout(burst, i*350);
}

// ====== Лепестки и сердечки на фоне ======
var cv = document.getElementById("fx"), cx = cv.getContext("2d"), P = [], B = [];
function size(){ cv.width = innerWidth*devicePixelRatio; cv.height = innerHeight*devicePixelRatio; }
addEventListener("resize", size); size();
function petal(){
  return { x:Math.random()*innerWidth, y:-20, r:5+Math.random()*9, vy:.4+Math.random()*.8,
           vx:-.3+Math.random()*.6, a:Math.random()*6, va:.01+Math.random()*.03, o:.35+Math.random()*.4 };
}
for(var i=0;i<22;i++){ var p=petal(); p.y=Math.random()*innerHeight; P.push(p); }
function burst(){
  for(var i=0;i<26;i++){
    var a = Math.random()*Math.PI*2, v = 2+Math.random()*5;
    B.push({ x:innerWidth/2, y:innerHeight/2, vx:Math.cos(a)*v, vy:Math.sin(a)*v-2, life:1, r:8+Math.random()*10 });
  }
}
function heart(x,y,r,rot,col){
  cx.save(); cx.translate(x,y); cx.rotate(rot); cx.beginPath();
  cx.moveTo(0,r*.35);
  cx.bezierCurveTo(-r,-r*.4,-r*.5,-r,0,-r*.45);
  cx.bezierCurveTo(r*.5,-r,r,-r*.4,0,r*.35);
  cx.fillStyle = col; cx.fill(); cx.restore();
}
function tick(){
  cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  cx.clearRect(0,0,innerWidth,innerHeight);
  P.forEach(function(p,i){
    p.y+=p.vy; p.x+=p.vx+Math.sin(p.a)*.4; p.a+=p.va;
    if(p.y>innerHeight+20) P[i]=petal();
    cx.globalAlpha=p.o; heart(p.x,p.y,p.r,Math.sin(p.a)*.6,"#e0587a");
  });
  B = B.filter(function(b){ return b.life>0; });
  B.forEach(function(b){
    b.x+=b.vx; b.y+=b.vy; b.vy+=.12; b.life-=.014;
    cx.globalAlpha=Math.max(b.life,0); heart(b.x,b.y,b.r,0,"#ff7a9c");
  });
  cx.globalAlpha=1; requestAnimationFrame(tick);
}
if(!matchMedia("(prefers-reduced-motion: reduce)").matches) tick();

render();
</script>
